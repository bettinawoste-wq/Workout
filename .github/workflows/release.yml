name: Release

# Pushing a tag like v1.0.0 builds a signed APK and attaches it to a GitHub Release.
# Running it by hand (Actions -> Release -> Run workflow) builds the same signed APK but only
# uploads it as a workflow artifact, so the signing secrets can be checked before tagging.
# One-time setup and the release steps are in docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches toolchainVersion in gradle/gradle-daemon-jvm.properties.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Without the keystore the Gradle build would quietly fall back to the debug key, which
      # must never end up in a release - so fail loudly instead.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set - see docs/releasing.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build the signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # versionCode only has to grow with every release so a newer APK can update an older
        # install; the workflow run number does that.
        run: >
          ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace
          -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "workout-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: workout-${{ env.VERSION }}
          path: workout-${{ env.VERSION }}.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "workout-$VERSION.apk"
          --title "$GITHUB_REF_NAME" --generate-notes

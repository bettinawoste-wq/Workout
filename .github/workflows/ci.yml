name: CI

# Changes land on master directly (docs/agents/issue-tracker.md), so every push gets its own
# full run: no concurrency group, which would cancel or drop the runs of earlier commits.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  text:
    name: Text files (UTF-8, line width)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Any Python 3 runs the script; pinned so CI doesn't change under it.
          python-version: '3.12'

      - name: Test the check script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check text files
        run: python3 scripts/check-text-files.py

  build:
    name: Build & Lint
    needs: text
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches toolchainVersion in gradle/gradle-daemon-jvm.properties.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble, lint and run JVM unit tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    needs: text
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
